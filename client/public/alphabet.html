<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('morseTrainerTheme');
                document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
            } catch (e) {
                document.documentElement.dataset.theme = 'dark';
            }
            try {
                var lang = localStorage.getItem('morseTrainerLanguage');
                document.documentElement.dataset.lang = lang === 'en' ? 'en' : 'ro';
                document.documentElement.lang = document.documentElement.dataset.lang;
            } catch (e) {
                document.documentElement.dataset.lang = 'ro';
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morse SMMMFN — Alfabet Morse</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/alphabet.css" />
</head>
<body class="dashboard-body">
    <div id="auth-gate" class="auth-gate" data-i18n="auth.checkingAccess">Checking access&hellip;</div>

    <div id="dashboard" hidden>
        <nav class="app-nav" aria-label="Main">
            <a href="/" class="app-nav-brand">Morse SMMMFN</a>
            <div class="app-nav-links">
                <a href="/" class="app-nav-link" data-i18n="nav.home">Home</a>
                <a href="/teacher.html" class="app-nav-link" data-i18n="nav.dashboard" data-nav-role="teacher" hidden>Dashboard</a>
                <a href="/sessions.html" class="app-nav-link" id="nav-group-sessions" data-i18n="nav.groupSessions">Group Sessions</a>
                <a href="/stats.html" class="app-nav-link" data-i18n="nav.statistics">Statistics</a>
                <a href="/gradebook.html" class="app-nav-link" data-i18n="nav.gradebook" data-nav-role="teacher" hidden>Electronic Gradebook</a>
                <a href="/alphabet.html" class="app-nav-link active" data-i18n="nav.morseAlphabet">Morse Alphabet</a>
            </div>
            <button class="app-nav-theme-toggle" id="theme-toggle-button" type="button">&#127753;</button>
            <div class="app-nav-lang-toggle" id="lang-toggle">
                <button type="button" data-lang-btn="ro">RO</button>
                <button type="button" data-lang-btn="en">EN</button>
            </div>
            <div class="app-nav-right">
                <span id="user-name" class="app-nav-user"></span>
                <button id="logout-button" class="app-nav-logout" type="button" data-i18n="nav.logout">Log out</button>
            </div>
        </nav>

        <main class="dash-main alphabet-main">
            <header class="alphabet-header">
                <h1><span class="accent" data-i18n="alphabet.title">Morse Alphabet</span></h1>
                <p class="subtitle" data-i18n="alphabet.subtitle">Every Morse character used by the application.</p>
                <p class="muted alphabet-hint"><span id="alphabet-play-hint"></span> <span class="alphabet-legend" data-i18n="alphabet.legend">· = dot   — = dash</span></p>
            </header>

            <div id="alphabet-error" class="modal-error" hidden></div>

            <section class="panel alphabet-section" aria-labelledby="alphabet-letters-title">
                <div class="panel-header">
                    <h2 id="alphabet-letters-title" data-i18n="alphabet.letters">Letters</h2>
                    <span class="muted" data-count-for="letters"></span>
                </div>
                <div class="alphabet-grid" id="alphabet-letters"></div>
            </section>

            <section class="panel alphabet-section" aria-labelledby="alphabet-numbers-title">
                <div class="panel-header">
                    <h2 id="alphabet-numbers-title" data-i18n="alphabet.numbers">Numbers</h2>
                    <span class="muted" data-count-for="numbers"></span>
                </div>
                <div class="alphabet-grid" id="alphabet-numbers"></div>
            </section>

            <section class="panel alphabet-section" aria-labelledby="alphabet-punctuation-title">
                <div class="panel-header">
                    <h2 id="alphabet-punctuation-title" data-i18n="alphabet.special">Special Characters</h2>
                    <span class="muted" data-count-for="punctuation"></span>
                </div>
                <div class="alphabet-grid" id="alphabet-punctuation"></div>
            </section>
        </main>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/morse-audio-player.js"></script>
    <script src="/js/alphabet.js"></script>
</body>
</html>
